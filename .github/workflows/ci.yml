name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo; least privilege by default.
permissions:
  contents: read

jobs:
  # Ruff and mypy read the same files and the same config wherever they run -- mypy is
  # pinned to python_version 3.10 regardless of the interpreter it runs on -- so running
  # them inside the matrix was the same answer computed fifteen times. Once is enough, and
  # a lint failure now reports as a lint failure rather than as every platform at once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy

  # Ubuntu carries every supported version, because it is the cheapest and quickest runner
  # and version differences are what the matrix is really for. The other two platforms get
  # the boundary versions rather than the full cross product: nothing in this library is
  # macOS-specific, and the one genuine platform difference -- Windows shipping no system
  # timezone database, which failed every Windows job and no other -- is not version
  # specific, so 3.10 and 3.14 bracket it.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
