[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "date-wrangler"
dynamic = ["version"]
description = "Wrangles messy human dates into clean ranges: parses 'last quarter', 'since March', '15 Jan 2024'."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Name only, no email: author metadata is baked into every published wheel and PyPI does
# not allow re-uploading a version to correct it. Add `email = "..."` here if you want a
# contact address published; otherwise issues go through the repository.
authors = [{ name = "Steephan Selvaradjou" }]
keywords = [
    "date", "dates", "date-parser", "date-range", "datetime", "parsing",
    "natural-language", "nlp", "period", "quarter", "fiscal", "fiscal-year",
    "ytd", "analytics", "finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

# Effectively no runtime dependencies: the one use of python-dateutil (relativedelta) is
# replaced by ~15 lines of month arithmetic in calendars.py, which keeps installs fast and
# avoids dragging a transitive version constraint into every consumer.
#
# The exception is Windows, which ships no system timezone database, so the stdlib's
# zoneinfo has nothing to read and `parse(..., tz=ZoneInfo("Asia/Kolkata"))` raises
# ZoneInfoNotFoundError. CI caught this: every Linux and macOS job passed and every
# Windows job failed. Making it conditional keeps Linux and macOS installs dependency-free.
dependencies = ['tzdata; platform_system == "Windows"']

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
date-wrangler = "date_wrangler.__main__:main"

[project.urls]
Homepage = "https://github.com/steephanselvaradjou/date-wrangler"
Issues = "https://github.com/steephanselvaradjou/date-wrangler/issues"
Source = "https://github.com/steephanselvaradjou/date-wrangler"

# Single source of truth for the version: __init__.py. Held in two places it drifts, and
# `date-wrangler --version` then disagrees with the wheel it came from.
[tool.hatch.version]
path = "src/date_wrangler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/date_wrangler"]

# Ship the source and the tests, nothing else. Without an explicit list hatchling sweeps
# in whatever is lying around -- the Hypothesis example database alone added ~600 files.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["**/.hypothesis", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/date_wrangler"]
